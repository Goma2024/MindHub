<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查本地存储</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .section {
            margin-bottom: 20px;
        }
        h2 {
            color: #555;
            font-size: 18px;
            margin-bottom: 10px;
        }
        pre {
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>本地存储检查</h1>
        
        <div class="section">
            <h2>appState 数据</h2>
            <pre id="appStateContent">加载中...</pre>
        </div>
        
        <div class="section">
            <h2>用户列表</h2>
            <pre id="usersContent">加载中...</pre>
        </div>
        
        <div class="section">
            <h2>操作</h2>
            <button onclick="clearLocalStorage()">清除本地存储</button>
            <button onclick="loadData()">重新加载数据</button>
        </div>
    </div>
    
    <script>
        function loadData() {
            try {
                const appState = localStorage.getItem('appState');
                const appStateElement = document.getElementById('appStateContent');
                const usersElement = document.getElementById('usersContent');
                
                if (appState) {
                    appStateElement.textContent = appState;
                    
                    const parsedState = JSON.parse(appState);
                    if (parsedState.users) {
                        usersElement.textContent = JSON.stringify(parsedState.users, null, 2);
                    } else {
                        usersElement.textContent = '没有找到用户数据';
                    }
                } else {
                    appStateElement.textContent = '本地存储中没有 appState 数据';
                    usersElement.textContent = '本地存储中没有 appState 数据';
                }
            } catch (error) {
                document.getElementById('appStateContent').textContent = '错误: ' + error.message;
                document.getElementById('usersContent').textContent = '错误: ' + error.message;
            }
        }
        
        function clearLocalStorage() {
            if (confirm('确定要清除所有本地存储数据吗？')) {
                localStorage.clear();
                loadData();
                alert('本地存储已清除');
            }
        }
        
        // 页面加载时自动加载数据
        loadData();
    </script>
</body>
</html>
